networks:
  chatnet:
    driver: bridge

services:
  server1:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db1
    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    networks:
      - chatnet
  server2:
    build: .
    ports:
      - "8081:8080"
    depends_on:
      - db2
    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    networks:
      - chatnet
  server3:
    build: .
    ports:
      - "8082:8080"
    depends_on:
      - db3
    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
    networks:
      - chatnet
 
  db1:
    image: postgres
    environment:
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASS} 
      POSTGRES_DB: ${DB_NAME}
  db2:
    image: postgres
    environment:
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASS} 
      POSTGRES_DB: ${DB_NAME}
  db3:
    image: postgres
    environment:
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASS} 
      POSTGRES_DB: ${DB_NAME}
